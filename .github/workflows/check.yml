name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack from a fresh checkout
        run: |
          mkdir -p .local
          npm pack --pack-destination .local
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm --prefix tests/consumer install --ignore-scripts ./.local/*.tgz
      - run: npm --prefix tests/consumer run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magicbox-package
          path: .local/*.tgz
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure
          include-hidden-files: true
          path: |
            test-results/
            .local/browser-report.json
            .local/bundle-size.json
