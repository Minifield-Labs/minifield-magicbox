name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify the release tag and main ancestry
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - name: Pack from a fresh checkout
        run: |
          mkdir -p .local
          npm pack --pack-destination .local
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - run: npm --prefix tests/consumer install --ignore-scripts ./.local/*.tgz
      - run: npm --prefix tests/consumer run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-package
          path: .local/*.tgz
          if-no-files-found: error
          include-hidden-files: true
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-package
          path: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the verified archive to npm
        run: npm publish ./package/*.tgz --access public --provenance --ignore-scripts
